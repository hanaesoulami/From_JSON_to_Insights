name: Run ETL and export results

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-etl:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: studentdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d studentdb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas psycopg2-binary

      - name: Wait for Postgres (Python)
        env:
          DB_HOST: postgres
          DB_NAME: studentdb
          DB_USER: postgres
          DB_PASSWORD: admin
        run: |
          python - <<'PY'
          import time, os
          import psycopg2

          host = os.getenv('DB_HOST', 'postgres')
          dbname = os.getenv('DB_NAME', 'studentdb')
          user = os.getenv('DB_USER', 'postgres')
          password = os.getenv('DB_PASSWORD', 'admin')

          delay = 2
          max_tries = 30
          for i in range(1, max_tries + 1):
              try:
                  conn = psycopg2.connect(host=host, dbname=dbname, user=user, password=password)
                  conn.close()
                  print('Postgres is ready')
                  break
              except Exception as e:
                  print(f'Attempt {i}/{max_tries} - Postgres not ready: {e}')
                  time.sleep(delay)
          else:
              raise SystemExit('Postgres did not become ready in time')
          PY

      - name: Run ETL
        env:
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: admin
          DB_NAME: studentdb
        run: |
          python main.py

      - name: Export results to CSV
        env:
          DB_NAME: studentdb
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: admin
        run: |
          python - <<'PY'
          import pandas as pd, psycopg2, os
          host = os.getenv('DB_HOST', 'postgres')
          dbname = os.getenv('DB_NAME', 'studentdb')
          user = os.getenv('DB_USER', 'postgres')
          password = os.getenv('DB_PASSWORD', 'admin')
          try:
              conn = psycopg2.connect(host=host, dbname=dbname, user=user, password=password)
          except Exception as e:
              print(f'Could not connect to {dbname}:', e)
              raise
          for tbl in ("users","songs","artists","time","songplays"):
              try:
                  df = pd.read_sql(f"SELECT * FROM {tbl} LIMIT 200", conn)
                  df.to_csv(f"{tbl}.csv", index=False)
                  print(f"Exported {tbl}.csv ({len(df)} rows)")
              except Exception as e:
                  print("Skipping", tbl, ":", e)
          conn.close()
          PY

      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: etl-output-csv
          path: |
            users.csv
            songs.csv
            artists.csv
            time.csv
            songplays.csv
          if-no-files-found: ignore
